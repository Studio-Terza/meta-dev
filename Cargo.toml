[workspace]
resolver = "3"
members = ["crates/meta-core", "crates/meta-ports", "crates/meta-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
meta-core = { path = "crates/meta-core" }
meta-ports = { path = "crates/meta-ports" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
syn = { version = "=3.0.9", default-features = false, features = ["full", "parsing", "visit"] }
toml = { version = "=0.9.12", default-features = false, features = ["parse", "serde", "std"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
disallowed_methods = "deny"
