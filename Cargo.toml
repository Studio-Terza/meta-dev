[workspace]
resolver = "3"
members = ["crates/*", "e2e", "fuzz"]
default-members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "UNLICENSED"

[workspace.dependencies]
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
rustc_lexer = { package = "ra-ap-rustc_lexer", version = "0.174.0" }
quote = "1.0.40"
syn = { version = "2.0.119", features = ["extra-traits", "full", "parsing", "visit"] }
tempfile = "3.27.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_core = { version = "1.0.229", features = ["result"] }
serde_json = "1.0.149"
thiserror = "2.0.20"
toml = "1.1.8"

[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
unwrap_used = "deny"
expect_used = "deny"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
panic = "deny"
indexing_slicing = "deny"
redundant_clone = "warn"
implicit_clone = "warn"
unnecessary_to_owned = "warn"
clone_on_ref_ptr = "warn"
needless_collect = "warn"
needless_pass_by_value = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
exit = "warn"
mem_forget = "warn"
get_unwrap = "warn"
unwrap_in_result = "warn"
print_stderr = "warn"
if_then_some_else_none = "warn"
else_if_without_else = "warn"
equatable_if_let = "warn"
useless_let_if_seq = "warn"
branches_sharing_code = "warn"
try_err = "warn"
partial_pub_fields = "warn"
field_scoped_visibility_modifiers = "warn"
rest_pat_in_fully_bound_structs = "warn"
unneeded_field_pattern = "warn"
unnecessary_rest_pattern = "warn"
collection_is_never_read = "warn"
set_contains_or_insert = "warn"
iter_with_drain = "warn"
iter_on_empty_collections = "warn"
unused_peekable = "warn"
iter_over_hash_type = "warn"
error_impl_error = "warn"
fallible_impl_from = "warn"
map_with_unused_argument_over_ranges = "warn"
create_dir = "warn"
verbose_file_reads = "warn"
filetype_is_file = "warn"
path_buf_push_overwrite = "warn"
pathbuf_init_then_push = "warn"
string_lit_chars_any = "warn"
string_lit_as_bytes = "warn"
needless_raw_strings = "warn"
trivial_regex = "warn"
modulo_arithmetic = "warn"
float_cmp_const = "warn"
lossy_float_literal = "warn"
decimal_literal_representation = "warn"
suspicious_operation_groupings = "warn"
suspicious_xor_used_as_pow = "warn"
mod_module_files = "warn"
pub_without_shorthand = "warn"
semicolon_inside_block = "warn"
unnecessary_self_imports = "warn"
unnecessary_struct_initialization = "warn"
ref_patterns = "warn"
single_char_lifetime_names = "warn"
needless_pass_by_ref_mut = "warn"
trait_duplication_in_bounds = "warn"
type_repetition_in_bounds = "warn"
large_stack_frames = "warn"
future_not_send = "warn"
significant_drop_in_scrutinee = "warn"
let_underscore_must_use = "warn"
search_is_some = "warn"
map_err_ignore = "warn"
str_to_string = "warn"
string_add = "warn"
string_slice = "warn"
print_stdout = "warn"
use_debug = "warn"
as_conversions = "warn"
