# The string-twiddling ban (owner 2026-10-30): a coarse speed bump for common ad hoc text and byte
# parsing. Parse text once, at a boundary registered in self/parse-boundaries.toml, into types.
# Formatting (join, concat, as_bytes, format!) is not banned. This file is the one copy of the list.
disallowed-methods = [
  "str::split",
  "str::rsplit",
  "str::splitn",
  "str::rsplitn",
  "str::split_terminator",
  "str::rsplit_terminator",
  "str::split_inclusive",
  "str::split_whitespace",
  "str::split_ascii_whitespace",
  "str::split_once",
  "str::rsplit_once",
  "str::trim",
  "str::trim_start",
  "str::trim_end",
  "str::trim_matches",
  "str::trim_start_matches",
  "str::trim_end_matches",
  "str::trim_ascii",
  "str::trim_ascii_start",
  "str::trim_ascii_end",
  "str::strip_prefix",
  "str::strip_suffix",
  "str::find",
  "str::rfind",
  "str::replace",
  "str::replacen",
  "str::starts_with",
  "str::ends_with",
  "str::lines",
  "str::to_lowercase",
  "str::to_uppercase",
  "str::to_ascii_lowercase",
  "str::to_ascii_uppercase",
  "str::make_ascii_lowercase",
  "str::make_ascii_uppercase",
  "str::eq_ignore_ascii_case",
  "slice::starts_with",
  "slice::ends_with",
  "slice::split",
  "slice::windows",
  "slice::trim_ascii",
  "slice::trim_ascii_start",
  "slice::trim_ascii_end",
  "slice::strip_prefix",
  "slice::strip_suffix",
  "std::io::BufRead::lines",
  "std::io::BufRead::split",
  "std::str::from_utf8",
  "std::string::String::from_utf8_lossy",
]
