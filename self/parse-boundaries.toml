# A parse boundary may opt out of the string-twiddling ban (clippy.toml, owner 2026-10-30)
# with one module-level #![allow(clippy::disallowed_methods)] in a file that is not a crate root
# or mod.rs. Each one is registered here: path, reason, source (owner YYYY-MM-DD: <words> or
# failure: <words>). A crate with a boundary puts #![deny(clippy::disallowed_methods)] at its root;
# every other crate root puts #![forbid(clippy::disallowed_methods)].
# The test crates/meta-core/tests/parse_boundaries checks all of this over every Rust file and
# Cargo.toml in the workspace.

[[boundary]]
path = "crates/meta-core/src/ids/parse.rs"
reason = "FromStr and TryFrom<String> impls: the one place id and newtype text becomes typed values"
source = "owner 2026-10-30: text is parsed once, at a declared boundary, into types"

[[boundary]]
path = "crates/meta-ports/src/real/jsonl.rs"
reason = "JSONL framing of the meta-dev log: one record per line, so a line is the unit that is read, parsed and reported"
source = "owner 2026-10-30: text is parsed once, at a declared boundary, into types"

[[boundary]]
path = "crates/meta-ports/src/real/stderr.rs"
reason = "a failed command's stderr is lossy text from another process; it is trimmed once into the one line shown"
source = "owner 2026-10-30: text is parsed once, at a declared boundary, into types"

[[boundary]]
path = "crates/meta-core/tests/parse_boundaries/source.rs"
reason = "the registry source field has a fixed shape, owner YYYY-MM-DD: words or failure: words, parsed once"
source = "owner 2026-10-30: text is parsed once, at a declared boundary, into types"
