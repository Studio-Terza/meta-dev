# Each rule must cite where it came from. A rule without a source is a bug.
# source = "owner YYYY-MM-DD: <words>" or "failure: <what happened>"

[[rule]]
id = "identity"
text = "Commit as Cinglein <64114772+Cinglein@users.noreply.github.com>; never any other email; no personal or machine details in files."
source = "owner 2026-10-26: personal email leaked into public history"
email = "64114772+Cinglein@users.noreply.github.com"

[[rule]]
id = "no-subagents"
text = "Do not spawn agents."
source = "owner 2026-10-28: CLAUDE_CODE_MAX_SUBAGENT_SPAWN_DEPTH=1; one centrally allocated pool"

[[rule]]
id = "pr-shape"
text = "One PR per coherent change, branched off main, however large. Do not stack."
source = "owner 2026-10-30: mega PRs are fine. CI is the only real gate. stacks were overused at that point in time and were causing way too much churn"

[[rule]]
id = "push-and-stop"
text = "Push, open the PR, run meta link, then stop. Do not wait on CI, except the red-first wait. Never merge."
source = "failure 2026-10-30: long-lived agents waiting on CI inflated context and waited on runs that never started"

[[rule]]
id = "background-agents"
text = "Leased agents run in the background (run_in_background), because only background launches report an agent id at start, so a crashed foreground agent cannot be resumed."
source = "failure 2026-10-30: stage 1 re-review; a crashed foreground agent had no id to resume"

[[rule]]
id = "budgets"
text = "Never change a budget or gate."
source = "owner 2026-10-27: budgets and gates are owner-only"

[[rule]]
id = "cargo-niceness"
text = "Run cargo under nice -n 19 with CARGO_BUILD_JOBS=2, one command at a time."
source = "owner 2026-10-28: thermal management"

[[rule]]
id = "no-email"
text = "Send no email. Web requests use the User-Agent basho-trip-planner."
source = "owner 2026-10: privacy"

[[rule]]
id = "red-first"
text = "Only in a PR that adds or tightens a check (a lint, budget or threshold): tighten the check in the first commit so CI goes red on its target; push the red commit first; waiting for its CI run is the one allowed CI wait (poll every 60 s, at most 20 min); then push the fix. Other PRs need no red run."
source = "owner 2026-10-25: we should have the cratemaxx lint go red first to verify that it works and then turn it green later in the pr"

[[rule]]
id = "review-gates"
text = "Review: flag any change that loosens a gate, such as the CI workflow, lint config, parse boundaries, rules, predictions or escape kinds."
source = "owner 2026-10-30: I don't want to get bombarded by a bunch of blocking requests... for now we stop this with normal review processes"

[[rule]]
id = "live-reads"
text = "A PR that adds or changes something that reads real data (the meta log, GitHub, git, any other external source) runs it against that real data before review, and the PR body says what it observed."
source = "failure 2026-10-31: the idle alarm and the drift query passed their tests and failed live"
