    "Fri 11  6 01:16:00 2026",
    "fri Nov  6 01:16:00 2026",
    "Fri Nov  6 01:16:00 99999",
    "",
]
replies = ["place(a.0, n1, about)", "  x  ", "x\ny", "", " \n\t", "x\u0000y", "\u0000"]
