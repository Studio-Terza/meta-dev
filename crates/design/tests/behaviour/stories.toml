[[story]]
name = "a stalled stop drains the queue in code and shows only what stays open"
transcript = [
  ["user", "4c371128-0000-4000-8000-000000000000", "what clears the queue?\nSome things need a ruling."],
  ["user", "f6484f7e-0000-4000-8000-000000000000", "Defer the merge queue."],
  ["assistant", "p1", "Understood."],
]
spec = """
# Tools retirement

D1 Dropped until missed (D2 later): waits.
D3 Hook rules only when missed (owner 2026-11-26): landing is deleted.
"""
