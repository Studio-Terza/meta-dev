[[story]]
name = "a done on a pushed branch opens its pull request and waits on ci"
spec = """
# Tools retirement

D1 Dropped until missed (D2 later): waits.

D2 Typed agent outcomes (owner de7a042f): the hook refuses (with D3) other endings.
D20 Later work (owner 1).
"""

[[story.finish]]
said = "DONE design/open-pr 0123456789abcdef0123456789abcdef01234567"
answers = [
  { asked = "api graphql -F owner=o -F name=r -f ref=refs/heads/design/open-pr -f query=query($owner:String!,$name:String!,$ref:String!){repository(owner:$owner,name:$name){ref(qualifiedName:$ref){target{oid}}}}", ran = "Succeeded", printed = '{"data":{"repository":{"ref":{"target":{"oid":"0123456789abcdef0123456789abcdef01234567"}}}}}' },
  { asked = "api repos/o/r/compare/main...0123456789abcdef0123456789abcdef01234567", ran = "Succeeded", printed = '{"commits":[{"commit":{"message":"Open it\n\nSpec: none here\n\nWhy.\n\nSpec: tools-retirement#D2\nCo-Authored-By: A"}},{"commit":{"message":"Spec: other#D9"}}]}' },
  { asked = "pr checks 12 --json name,bucket,link -R o/r", ran = "Failed", printed = '[{"bucket":"pass","link":"https://github.com/o/r/actions/runs/9/job/456","name":"test"}]' },
  { asked = "pr checks 12 --json name,state -R o/r", ran = "Failed", printed = '[{"name":"test","state":"IN_PROGRESS"}]' },
  { asked = "pr checks 12 --watch --fail-fast -R o/r", ran = "Succeeded", printed = "" },
  { asked = """
pr create --head design/open-pr --base main --title D2 Typed agent outcomes --body spec: tools-retirement#D2

🤖 Generated with [Claude Code](https://claude.com/claude-code) -R o/r""", ran = "Succeeded", printed = """
https://github.com/o/r/pull/12
""" },
  { asked = "pr view 12 --json headRefOid -R o/r", ran = "Succeeded", printed = '{"headRefOid":"0123456789abcdef0123456789abcdef01234567"}' },
  { asked = "pr view design/open-pr --json number -R o/r", ran = "Succeeded", printed = '{"number":12}' },
]

