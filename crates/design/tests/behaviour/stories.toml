# Each story runs design's commands and hooks against a fresh temporary home with the real file
# and store ports; every path is relative to that home. Each step's input is the raw hook JSON
# Claude Code sends, records are raw transcript lines, and heard lists the world's answers in
# the order design asks; stories.txt holds what each step shows, every call and pause it asked
# for, and the queue it leaves.

[[story]]
name = "ingest reads each session once, a dry run writes nothing, and a grown transcript resumes"
records = [
  '{"message":{"content":"Merge only when CI is green.","model":"claude"},"origin":{"kind":"human"},"parentUuid":null,"sessionId":"s","timestamp":"2026-01-01T00:00:00Z","type":"user","uuid":"o1"}',
  '{"message":{"content":[{"text":"Understood.","type":"text"}],"model":"claude"},"origin":null,"parentUuid":null,"sessionId":"s","timestamp":"2026-01-01T00:00:00Z","type":"assistant","uuid":"p1"}',
  '{"type":"brand-new-kind","uuid":"x1","parentUuid":null,"sessionId":"s","timestamp":"2026-01-01T00:00:00Z"}',
]

[[story.step]]
words = ["ingest", "--dry-run"]

[[story.step]]
words = ["ingest"]

[[story.step]]
words = ["ingest"]

[[story.step]]
words = ["ingest"]
append = ['{"message":{"content":"Ship it.","model":"claude"},"origin":{"kind":"human"},"parentUuid":null,"sessionId":"s","timestamp":"2026-01-01T00:00:00Z","type":"user","uuid":"o2"}']

