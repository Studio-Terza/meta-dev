# Each story runs design's commands and hooks against a fresh home with a real file store;
# stories.txt holds what each step shows, every scripted call it made, and the queue it leaves.

[[story]]
name = "ingest reads each session once, a dry run writes nothing, and a grown transcript resumes"
transcript = [["user", "o1", "Merge only when CI is green."], ["assistant", "p1", "Understood."]]
records = ['{"type":"brand-new-kind","uuid":"x1","parentUuid":null,"sessionId":"s","timestamp":"2026-01-01T00:00:00Z"}']

[[story.step]]
words = ["ingest", "--dry-run"]

[[story.step]]
words = ["ingest"]

[[story.step]]
words = ["ingest"]

[[story.step]]
words = ["ingest"]
append = [["user", "o2", "Ship it."]]

