# Each story runs design's commands and hooks, step by step, against a fresh home with a real file
# store; its golden beside this file holds what each step ended with and showed, every scripted call
# it made, and the queue and workspace settings it leaves. `Home` holds what every story's home
# starts with and which files it leaves.

[[Home]]
moved = { "/private/tmp" = "tmp", "/home" = "" }
environment = { HOME = "/home", PWD = "/home" }
arguments = ["--workspace", "work"]
directories = ["/home/work/.meta", "/home/placed"]
left = ["/home/placed/queue.toml", "/home/work/.claude/settings.local.json"]

[Home.files]
"/home/work/.meta/local.toml" = """
queue = "/home/placed/queue.toml"
specs = "/home/placed/specs"
repository = "o/r"
"""
"/home/.claude/projects/-home-work/s.jsonl" = ""

# The design binary itself, named by the variable cargo sets for its tests and run on the real
# ports through the system shell: an event it cannot read fails, and one it reads is answered on
# standard output.
[Binary.unreadable-input]
program = "CARGO_BIN_EXE_design"
flag = "--workspace"
workspace = "work"
directories = ["work/.meta"]
words = ["hook", "stop"]
input = "not json"
timeout = 60

[Binary.refused-loop]
program = "CARGO_BIN_EXE_design"
flag = "--workspace"
workspace = "work"
directories = ["work/.meta"]
words = ["hook", "pre-tool-use"]
input = '{"cwd":"/work/agent","hook_event_name":"PreToolUse","session_id":"s","tool_input":{"command":"for d in a b; do rm -rf \"$d\"; done"},"tool_name":"Bash"}'
timeout = 60

