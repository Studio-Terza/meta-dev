# Calls the system shell runs together; tests/ran.txt holds what each returns. A call whose deadline
# is already due is killed at once, however long it would run.

[[call]]
program = "sh"
arguments = ["-c", "cat"]
fed = "a prompt handed on standard input"
seconds = 3

[[call]]
program = "sh"
arguments = ["-c", "printf 'printed'; exit 3"]
seconds = 3

[[call]]
program = "sh"
arguments = ["-c", "cat; printf 'read nothing'"]
seconds = 3

[[call]]
program = "tail"
arguments = ["-f", "/dev/null"]
seconds = 0

[[call]]
program = "a-program-that-is-not-installed"
arguments = []
seconds = 3
