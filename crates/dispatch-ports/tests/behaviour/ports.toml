[Envelopes.envelopes]
texts = [
  "{\"type\":\"result\",\"subtype\":\"success\",\"is_error\":false,\"result\":\"conversational(a.0)\",\"usage\":{\"input_tokens\":4,\"output_tokens\":9,\"cache_creation_input_tokens\":2,\"cache_read_input_tokens\":7,\"service_tier\":\"standard\"}}",
  "{\"subtype\":\"success\",\"result\":\"x\",\"usage\":{\"input_tokens\":1,\"output_tokens\":2}}",
  "{\"type\":\"result\",\"subtype\":\"success\",\"is_error\":true,\"result\":\"Invalid API key\",\"usage\":{\"input_tokens\":0,\"output_tokens\":0}}",
  "{\"subtype\":\"error_during_execution\",\"is_error\":true,\"usage\":{\"input_tokens\":1,\"output_tokens\":2}}",
  "{\"subtype\":\"error_max_turns\",\"result\":\"x\",\"usage\":{\"input_tokens\":1,\"output_tokens\":2}}",
  "{\"subtype\":\"success\",\"usage\":{\"input_tokens\":1,\"output_tokens\":2}}",
  "{\"subtype\":\"success\",\"result\":\"  \",\"usage\":{\"input_tokens\":1,\"output_tokens\":2}}",
  "{\"subtype\":\"success\",\"result\":\"x\"}",
  "not json"
]


[Starts.starts]
texts = [
    "Fri Nov  6 01:16:00 2026",
    "Mon Jan  1 00:00:00 1970",
    "Sun Dec 31 23:59:59 2199",
    "Wed Feb 29 12:30:45 2028",
    "not a start",
    "",
]

[Watched.overdue]
start = 1800000000
timeouts = [20, 50, 80, 110, 140, 170]
paces = [
    { pid = 7, reply = "conversational(a.0)", oversleep = { after = 0, by = 200 } },
    { pid = 7, reply = "conversational(a.0)", oversleep = { after = 1, by = 200 } },
    { pid = 7, reply = "conversational(a.0)", oversleep = { after = 4, by = 200 } },
    { pid = 7, reply = "conversational(a.0)", oversleep = { after = 8, by = 200 } },
]

[Watched.replied]
start = 1800000000
timeouts = [20, 50, 80, 110, 140, 170]
paces = [
    { pid = 7, reply = "conversational(a.0)", finishing = 1, oversleep = { after = 9, by = 200 } },
    { pid = 7, reply = "conversational(a.0)", finishing = 2, oversleep = { after = 9, by = 200 } },
    { pid = 7, reply = "conversational(a.0)", finishing = 5, oversleep = { after = 9, by = 200 } },
    { pid = 7, reply = "conversational(a.0)", finishing = 8, oversleep = { after = 9, by = 200 } },
]

[Living.living]
program = "sleep"
arguments = ["30"]

[Agents.echoed]
agent = { program = "sh", arguments = ["-c", "cat"] }
prompt = '{"subtype":"success","result":"conversational(a.0)","usage":{"input_tokens":4,"output_tokens":9,"cache_creation_input_tokens":2,"cache_read_input_tokens":7}}'
models = ["Haiku"]
timeout = 2

[Agents.modelled]
agent = { program = "sh", arguments = ["-c", """cat >/dev/null; printf '{"subtype":"success","result":"%s %s","usage":{"input_tokens":1,"output_tokens":1}}' "$0" "$1\""""] }
prompt = ""
models = ["Haiku", "Sonnet"]
timeout = 2

[Stalling.stalling]
agents = [
    { program = "sh", arguments = ["-c", "exec sleep 30"] },
    { program = "sh", arguments = ["-c", "exec 0<&-; exec sleep 30"] },
]
filler = "x"
size = 262144
start = 1800000000
timeout = 1

[Bells.bells]
sleeping = { program = "sh", arguments = ["-c", "exec sleep 30"] }
speaking = { program = "sh", arguments = ["-c", "echo spoken"] }
prompt = "x"
start = 1800000000
pause = 1
quiet = { secs = 0, nanos = 50000000 }
timeout = 60

[Shells.shells]
program = "sh"
calls = [
    { arguments = ["-c", "basename \"$PWD\""], timeout = 5 },
    { arguments = ["-c", "printf refused; exit 3"], timeout = 5 },
    { arguments = ["-c", "exec sleep 4"], timeout = 0 },
]
