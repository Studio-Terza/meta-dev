[package]
name = "ports"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[package.metadata.port]
owns = ["rusqlite"]
shared = ["hex", "proc-macro2", "quote", "serde", "serde_core", "serde_json", "sha2", "syn", "thiserror"]

[lib]
test = false
doctest = false

[dependencies]
file-ports = { path = "../file-ports" }
grammar = { path = "../grammar" }
invariants = { path = "../invariants" }
newtype = { path = "../newtype" }
port-derive = { path = "../port-derive" }
rusqlite = { version = "0.37.0", default-features = false, features = ["serialize"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
store-ports-macros = { path = "../store-ports-macros" }
strum.workspace = true
thiserror.workspace = true

[dev-dependencies]
design-messages = { path = "../design-messages" }
proptest.workspace = true
tempfile.workspace = true
test-failure = { path = "../test-failure" }

[lints]
workspace = true
