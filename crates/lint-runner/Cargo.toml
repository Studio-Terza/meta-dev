[package]
name = "lint-runner"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
autotests = false

[lib]
test = false
doctest = false

[dependencies]
invariants = { path = "../invariants" }
lint-sweep = { path = "../lint-sweep" }
cargo-ports = { path = "../cargo-ports" }
file-ports = { path = "../file-ports" }
lint-core = { path = "../lint-core" }
lint-file = { path = "../lint-file" }
lint-reader = { path = "../lint-reader" }
lint-layout = { path = "../lint-layout" }
lint-bool-methods = { path = "../lint-bool-methods" }
lint-const-shape = { path = "../lint-const-shape" }
lint-enum-predicates = { path = "../lint-enum-predicates" }
lint-expression-flow = { path = "../lint-expression-flow" }
lint-fn-shape = { path = "../lint-fn-shape" }
lint-literal-names = { path = "../lint-literal-names" }
lint-manual-iteration = { path = "../lint-manual-iteration" }
lint-named-lifetimes = { path = "../lint-named-lifetimes" }
lint-named-numbers = { path = "../lint-named-numbers" }
lint-no-comments = { path = "../lint-no-comments" }
lint-no-forwarders = { path = "../lint-no-forwarders" }
lint-no-free-fns = { path = "../lint-no-free-fns" }
lint-no-numbers-in-binaries = { path = "../lint-no-numbers-in-binaries" }
lint-no-ignored-tests = { path = "../lint-no-ignored-tests" }
lint-no-test-only-api = { path = "../lint-no-test-only-api" }
lint-private-fns = { path = "../lint-private-fns" }
lint-process-starters = { path = "../lint-process-starters" }
lint-public-api-tests = { path = "../lint-public-api-tests" }
lint-public-surface = { path = "../lint-public-surface" }
lint-test-budget = { path = "../lint-test-budget" }
lint-thin-main = { path = "../lint-thin-main" }
lint-type-shape = { path = "../lint-type-shape" }
lint-vec-out-params = { path = "../lint-vec-out-params" }
port-core = { path = "../port-core" }
timer-ports = { path = "../timer-ports" }
thiserror.workspace = true
workspace-metadata = { path = "../workspace-metadata" }

[[test]]
name = "behaviour"
path = "tests/behaviour.rs"

[dev-dependencies]
cargo-ports = { path = "../cargo-ports" }
lint-fixtures = { path = "../lint-fixtures" }
text-lines = { path = "../text-lines" }

[lints]
workspace = true
