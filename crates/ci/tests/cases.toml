# Each case runs the ci binary in a fresh directory holding `files`, then expects its exit code, the
# start of its standard output and error, and the whole of every file in `written`.

[[case]]
arguments = ["timed", "limits.toml", "lint", "true"]
files = { "limits.toml" = "[lint]\nblock = 1\n" }
code = 0
out = "lint: within block 1 s, took 0.0 s\n"

[[case]]
arguments = ["timed", "limits.toml", "lint", "sleep", "0.15"]
files = { "limits.toml" = "[lint]\nblock = 0.1\n" }
code = 1
out = "::error::lint: above block 0.1 s, took "

[[case]]
arguments = ["timed", "limits.toml", "lint", "--since", "mark", "true"]
files = { "limits.toml" = "[lint]\nblock = 99999999999\n", "mark" = "0\n" }
code = 0
out = "lint: within block 99999999999 s, took 1"

[[case]]
arguments = ["timed", "limits.toml", "lint", "false"]
files = { "limits.toml" = "[lint]\nblock = 3.5\n" }
code = 1
out = "::error::lint failed: exit status: 1\nlint: within block 3.5 s, took "

[[case]]
arguments = ["timed", "limits.toml", "lint", "absent-program"]
files = { "limits.toml" = "[lint]\nblock = 0\n" }
code = 1
err = "cannot start absent-program: No such file or directory"

[[case]]
arguments = ["timed", "limits.toml", "lint", "true"]
files = { "limits.toml" = "[lint]\nblock = -1\n" }
code = 1
err = "a limit is not a number of seconds: "

[[case]]
arguments = ["timed", "limits.toml", "lint", "true"]
files = { "limits.toml" = "[lint]\nwarn = 0\n" }
code = 1
err = "cannot read the limits: "

[[case]]
arguments = ["timed", "limits.toml", "lint", "true"]
files = { "limits.toml" = "[clippy]\nblock = 0\n" }
code = 1
err = "the limits hold no stage named lint\n"

[[case]]
arguments = ["timed", "limits.toml", "lint", "true"]
code = 1
err = "cannot read limits.toml: "

[[case]]
arguments = ["timed", "limits.toml", "lint", "sh", "-c", "exit 0"]
files = { "limits.toml" = "[lint]\nblock = 1\n" }
code = 0
out = "lint: within block 1 s, took 0.0 s\n"

[[case]]
arguments = ["timed", "limits.toml", "lint", "--since", "mark", "true"]
files = { "limits.toml" = "[lint]\nblock = 1000\n", "mark" = "0\n" }
code = 1
out = "::error::lint: above block 1000 s, took 1"

[[case]]
arguments = ["timed", "limits.toml", "lint", "--since", "mark", "true"]
files = { "limits.toml" = "[lint]\nblock = 0\n", "mark" = "99999999999\n" }
code = 1
err = "mark does not hold a start time in seconds since 1970, before now\n"

[[case]]
arguments = ["timed", "limits.toml", "lint", "--since", "mark", "true"]
files = { "limits.toml" = "[lint]\nblock = 0\n", "mark" = "soon" }
code = 1
err = "mark does not hold a start time in seconds since 1970, before now\n"

[[case]]
arguments = ["timed"]
code = 1
err = "usage: ci timed "

[[case]]
arguments = ["plan", "a", "b", "c", "d", "e"]
code = 1
err = "usage: ci timed "

[[case]]
arguments = ["mutants-plan", "workspace.json", "diff.json", "changed", "unselected.txt", "output"]
code = 0
out = """
mutants: every one in the crates whose tests changed: []
mutants: 5 of 7 selected, 5 in the diff; every one tested, in 1 shards
"""
[case.files]
"workspace.json" = '[{"name":"a.rs:1:1: x","file":"a.rs"},{"name":"b.rs:1:1: y","file":"b.rs"},{"name":"b.rs:2:1: z","file":"b.rs"},{"name":"c.rs:1:1: v","file":"c.rs"},{"name":"d.rs:1:1: n","file":"d.rs"},{"name":"k/src/x.rs:1:1: k","file":"k/src/x.rs"},{"name":"j/src/y.rs:1:1: j","file":"j/src/y.rs"}]'
"diff.json" = '[{"name":"a.rs:1:1: x","file":"a.rs"},{"name":"b.rs:1:1: y","file":"b.rs"},{"name":"b.rs:2:1: z","file":"b.rs"},{"name":"c.rs:1:1: v","file":"c.rs"},{"name":"d.rs:1:1: n","file":"d.rs"}]'
"changed" = ""
"output" = "earlier=1\n"
[case.written]
"unselected.txt" = "k/src/x.rs:1:1: k\nj/src/y.rs:1:1: j\n"
"output" = "earlier=1\nshards=[0]\n"

[[case]]
arguments = ["mutants-plan", "workspace.json", "diff.json", "changed", "unselected.txt", "output"]
code = 0
out = """
mutants: every one in the crates whose tests changed: [k]
mutants: 6 of 7 selected, 5 in the diff; every one tested, in 1 shards
"""
[case.files]
"workspace.json" = '[{"name":"a.rs:1:1: x","file":"a.rs"},{"name":"b.rs:1:1: y","file":"b.rs"},{"name":"b.rs:2:1: z","file":"b.rs"},{"name":"c.rs:1:1: v","file":"c.rs"},{"name":"d.rs:1:1: n","file":"d.rs"},{"name":"k/src/x.rs:1:1: k","file":"k/src/x.rs"},{"name":"j/src/y.rs:1:1: j","file":"j/src/y.rs"}]'
