"changed" = "2\t0\tk/tests/t.rs\n0\t0\tj/src/y.rs\n"
"output" = "earlier=1\n"
[case.written]
"unselected.txt" = "j/src/y.rs:1:1: j\n"
"output" = "earlier=1\nshards=[0]\n"

[[case]]
arguments = ["mutants-plan", "workspace.json", "diff.json", "changed", "unselected.txt", "output", "numstat", "outcomes.json"]
code = 1
err = "usage: ci timed "

[[case]]
arguments = ["mutants-plan", "workspace.json", "diff.json", "changed", "unselected.txt", "output"]
code = 0
out = """
mutants: every one in the crates whose tests changed: []
mutants: 0 of 0 selected, 0 in the diff; every one tested, in 1 shards
"""
files = { "workspace.json" = "", "diff.json" = "", "changed" = "" }
written = { "unselected.txt" = "", "output" = "shards=[0]\n" }

[[case]]
arguments = ["mutants-plan", "workspace.json", "diff.json", "changed", "unselected.txt", "output"]
code = 1
err = "a numstat row is not added, deleted and path separated by tabs: 1 a.rs\n"
files = { "workspace.json" = "[]", "diff.json" = "[]", "changed" = "1 a.rs\n" }

[[case]]
arguments = ["mutants-plan", "workspace.json", "diff.json", "changed", "unselected.txt", "output"]
