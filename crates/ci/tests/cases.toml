err = "cannot read ./outcomes.json: "

[[case]]
arguments = ["kill-matrix", "report.json", "."]
code = 1
err = "cannot read the outcomes in ./outcomes.json: "
files = { "outcomes.json" = '{ "outcomes": [{ "scenario": "Baseline", "summary": "Shrugged", "log_path": "baseline.log" }] }' }

[[case]]
arguments = ["kill-matrix", "report.json", "."]
code = 1
err = "cannot read ./baseline.log: "
files = { "outcomes.json" = '{ "outcomes": [{ "scenario": "Baseline", "summary": "Success", "log_path": "baseline.log" }] }' }

# A test is in the matrix if any run names it: one only the baseline ran, one only a missed
# mutant's run reached and one only an unviable mutant's run reached are all tautological.
[[case]]
arguments = ["kill-matrix", "report.json", "."]
code = 0
out = "kill matrix: 0 mutants caught, 0 by no named test, 1 missed, 1 unviable; 3 tests, 0 golden: 3 tautological, 0 in 0 redundant groups, 0 pinning\n"
[case.files]
"outcomes.json" = '''
{
  "outcomes": [
    { "scenario": "Baseline", "summary": "Success", "log_path": "baseline.log" },
    { "scenario": { "Mutant": { "name": "a.rs:1:1: m1" } }, "summary": "MissedMutant", "log_path": "missed.log" },
    { "scenario": { "Mutant": { "name": "a.rs:2:1: m2" } }, "summary": "Unviable", "log_path": "unviable.log" }
  ]
}
'''
"baseline.log" = '''
     Running `/t/target/debug/build/ci/0123456789abcdef/out/behaviour-0123456789abcdef`
test only_in_the_baseline ... ok
'''
"missed.log" = '''
     Running `/t/target/debug/build/ci/0123456789abcdef/out/behaviour-0123456789abcdef`
test only_past_a_missed_mutant ... ok
'''
"unviable.log" = '''
     Running `/t/target/debug/build/ci/0123456789abcdef/out/behaviour-0123456789abcdef`
test only_past_an_unviable_mutant ... ok
'''

[[case]]
arguments = ["kill-matrix", "absent/report.json", "."]
code = 1
err = "cannot write absent/report.json: "
files = { "outcomes.json" = '{ "outcomes": [] }' }
