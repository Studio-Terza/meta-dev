# Texts the shell lexer reads; tests/lexed.txt holds what it reads them as.
shell = [
    'for d in a b; do rm -rf "$d"; done',
    "bash -c 'rm x'",
    'sh -c "rm -rf /tmp/x"',
    "zsh -ec 'cd a && rm b'",
    "find . -name x -delete",
    """find . -name '*.o' -exec rm {} \\;""",
    "find . -type d -empty -exec rmdir {} +",
    "ls | xargs rm",
    "ls | xargs -I {} rm {}",
    "printf a | xargs -0 -n1 rm -f",
    "echo $(rm x)",
    'x="$(rm y)"',
    "echo `rm x`",
    "(cd a && rm b)",
    "cleanup() { rm -rf build; }; cleanup",
    "function tidy { rmdir out; }",
    "if [ -e x ]; then rm x; fi",
    'while read f; do rm "$f"; done < list',
    'case "$x" in a) rm a;; esac',
    "bash <<'EOF'\nrm x\nEOF",
    "sh <<-EOF\n\trm x\n\tEOF",
    "cat <<A; bash <<B\nrm x\nA\nrm y\nB",
    "bash <<A\nrm x",
    "cat <<A\nrm x\nA\nrm y",
    "cat <<-A\n\trm x\n\tA\nrm y",
    "cat <<A\n\tA\nrm y\nA",
    "bash <<A\n\tA\nrm y\nA",
    "bash <<A\necho a\nrm x\nA\necho done",
    ">log bash -c 'rm x'",
    'cd /w && for f in *.tmp; do /bin/rm "$f"; done',
    "bash -c 'for f in a; do rm $f; done'",
    'for f in a; do bash -c "rm $f"; done',
    """xargs sh -c 'rm "$1"' _""",
    """find . -exec echo {} \\; -delete""",
    'echo "`rm x`"',
    "true && { rm x; }",
    "{ echo a; echo b; } > log; rm x",
    "(( i++ )); echo \"$(( 1 + 2 ))\"; rm x",
    "cat a 2>&1 >/dev/null | tee log; rm x",
    "rm x",
    "rm -rf /tmp/build && rmdir /tmp/empty",
    "git rm x",
    "echo rm",
    "cd /w; rm a; rm b",
    "\\rm x",
    "git commit -m \"$(cat <<'EOF'\nfor x; do rm y; done\nEOF\n)\"",
    "grep -rn 'rm -rf' . | xargs echo",
    """find . -name '*.rs' -exec grep -l rm {} \\; -print""",
    'echo "for x in a; do rm; done"',
    "for f in rm rmdir; do echo $f; done",
    "cat <<EOF\nrm x\nEOF",
    "ls # rm x",
    "printf 'rm x' > script.sh",
    'for d in a b; do echo "$d"; done; rm -rf a',
    "case x in rm) echo;; esac",
    "RM=rm make clean",
    'rm -rf "$(git rev-parse --show-toplevel)/target"',
    "'unterminated rm",
    "",
    "sed -i 's/a/b/' src/lib.rs",
    "sed -i '' -e 's/a/b/' x.rs",
    "gsed --in-place=.bak 's/a/b/' x.rs",
    "sed -ni 's/a/b/p' x.rs",
    "sed -n 's/i/b/p' x.rs",
    "perl -pi -e 's/a/b/' x.rs",
    "perl -i.bak -pe 's/a/b/' x.rs",
    "perl -Mstrict -ne 'print' x.rs",
    "for f in *.rs; do sed -i 's/a/b/' \"$f\"; done",
    "echo a > src/x.rs",
    "cargo test 2>/dev/null >> log.txt",
    "cat <<'EOF' > notes.md\nhello\nEOF",
    "grep x < input.txt",
    "echo a | tee -a out.txt other.txt",
    "(cd a && echo b > c)",
    "mv src/a.rs /tmp/a.rs",
    "mv -f a b c dest/",
    "mv only",
    "git mv a b",
    "echo '> not a redirect' 'sed -i'",
    "cd src && echo a > x.rs",
    "cd /a; cd b; echo a > x",
    "cd $HOME/repo && echo a > x",
    "cd - && echo a > x",
    "cd && echo a > x",
    "cd ~/r; cd /abs && echo a > x",
    """cd /w && S=/tmp/s; export CARGO_TARGET_DIR=$S/t; P=(${(f)"$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | "-p", .name')"}); cargo clean -q $P; cargo test --workspace --no-run -q 2>&1 | tail -4""",
    "P=(a b c); echo $P",
    "files+=(x)",
    'echo "${(j:,:)names}"',
    "echo ${name:-default} ${#name} ${name%.rs}",
    "cargo test --workspace",
]
