[package]
name = "query-ports"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[package.metadata.port]
owns = ["sqlx", "sqlx-core", "sqlx-macros", "sqlx-mysql", "sqlx-postgres", "sqlx-sqlite", "tokio", "tokio-stream"]
shared = ["hex", "proc-macro2", "quote", "serde", "serde_core", "serde_json", "sha2", "syn", "thiserror"]

[lib]
test = false
doctest = false

[dependencies]
console-ports = { path = "../console-ports" }
exit = { path = "../exit" }
hex.workspace = true
proc-macro2.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
libsqlite3-sys = { version = "0.35.0", default-features = false, features = ["bundled_bindings"] }
sqlx-core = { version = "0.9.0", default-features = false, features = ["offline"] }
sqlx-sqlite = { version = "0.9.0", default-features = false, features = ["offline"] }
syn.workspace = true
thiserror.workspace = true
tokio.workspace = true

[dev-dependencies]
golden = { path = "../golden" }
tempfile.workspace = true

[lints]
workspace = true
