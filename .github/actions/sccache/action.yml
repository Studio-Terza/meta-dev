name: sccache
description: Provide the pinned sccache under target/sccache, restored from the actions cache or downloaded and verified once, and expose the actions cache service credentials to later steps
runs:
  using: composite
  steps:
    - name: sccache needs x86_64
      shell: bash
      run: test ${{ runner.arch }} = X64
    - uses: ./.github/actions/release
      with:
        name: sccache
        url: https://github.com/mozilla/sccache/releases/download/v0.19.0/sccache-v0.19.0-x86_64-unknown-linux-musl.tar.gz
        checksum: ${{ github.action_path }}/sccache.sha256
        key: sccache-0.19.0-${{ runner.os }}-${{ runner.arch }}
    - name: sccache environment
      uses: crazy-max/ghaction-github-runtime@v3.0.0
