name: mold
description: Install the pinned mold linker from the actions cache, downloading only on a cache miss
runs:
  using: composite
  steps:
    - id: cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/mold-3.0.0
        key: mold-3.0.0-${{ runner.os }}
    - if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        MOLD_URL: https://github.com/rui314/mold/releases/download/v3.0.0/mold-3.0.0-x86_64-linux.tar.gz
        MOLD_SHA256: 6c90d4a474c7c0409dfb575be03a5345878ac14fdba18de8b40fa58c60121189
      run: |
        set -euo pipefail
        archive="$RUNNER_TEMP/mold.tar.gz"
        delay=2
        for attempt in 1 2 3 4 5 6; do
          if curl --fail --silent --show-error --location --connect-timeout 20 --max-time 300 --output "$archive" "$MOLD_URL" \
            && echo "$MOLD_SHA256  $archive" | sha256sum --check --status; then
            break
          fi
          if [ "$attempt" = 6 ]; then
            echo "mold download or checksum failed after $attempt attempts" >&2
            exit 1
          fi
          sleep "$delay"
          delay=$((delay * 2))
        done
        mkdir -p "$HOME/.cache/mold-3.0.0"
        tar -xzf "$archive" -C "$HOME/.cache/mold-3.0.0" --strip-components=1
    - shell: bash
      run: echo "$HOME/.cache/mold-3.0.0/bin" >> "$GITHUB_PATH"
