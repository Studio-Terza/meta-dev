name: tools
description: Build the CI tools in the dev profile, cached by the workspace sources

runs:
  using: composite
  steps:
    - uses: actions/cache@v4
      id: tools
      with:
        path: ${{ github.workspace }}/target/ci/tools
        key: tools-${{ runner.os }}-opt${{ env.CARGO_PROFILE_DEV_OPT_LEVEL }}-debug${{ env.CARGO_PROFILE_DEV_DEBUG }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'crates/**/Cargo.toml', 'crates/**/src/**') }}
    - name: tools
      if: steps.tools.outputs.cache-hit != 'true'
      shell: bash
      run: cargo run --locked --bin ci -- tools target/debug "$TOOLS"
