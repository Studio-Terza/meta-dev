name: ci

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

jobs:
  gates:
    runs-on: ubuntu-latest
    env:
      TOOLS: ${{ github.workspace }}/target/ci/tools
      MEASURED: ${{ github.workspace }}/target/ci/measured.toml
      METADATA: ${{ github.workspace }}/target/ci/metadata.json
      TESTLOG: ${{ github.workspace }}/target/ci/test.txt
      BUDGET: ${{ github.workspace }}/target/ci/budget.txt
      LIMITS: ${{ github.workspace }}/target/ci/limits.txt
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: toolchain
        run: rustup toolchain install
      - uses: actions/cache@v4
        id: tools
        with:
          path: ${{ github.workspace }}/target/ci/tools
          key: tools-${{ runner.os }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'crates/lint*/Cargo.toml', 'crates/lint*/src/**', 'crates/newtype*/Cargo.toml', 'crates/newtype*/src/**', 'crates/reach/Cargo.toml', 'crates/reach/src/**', 'crates/ci/Cargo.toml', 'crates/ci/src/**', 'crates/mutation-report/Cargo.toml', 'crates/mutation-report/src/**', 'crates/text-lines/Cargo.toml', 'crates/text-lines/src/**') }}
      - name: tools
        if: steps.tools.outputs.cache-hit != 'true'
        run: cargo run -q --bin ci -- tools target/debug "$TOOLS"
      - name: reach
        run: '"$TOOLS/ci" reach "$METADATA" "$GITHUB_EVENT_NAME" "$GITHUB_ENV" "$GITHUB_STEP_SUMMARY"'
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        if: env.CARGO_SCOPE != ''
        run: '"$TOOLS/ci" timed "$MEASURED" clippy cargo clippy --all-targets $CARGO_SCOPE -- -D warnings'
      - name: test compile
        if: env.CARGO_SCOPE != ''
        run: '"$TOOLS/ci" timed "$MEASURED" test-compile cargo test --no-run $CARGO_SCOPE'
      - name: test run
        if: env.CARGO_SCOPE != ''
        run: '"$TOOLS/ci" logged "$TESTLOG" cargo test $CARGO_SCOPE'
      - name: test run seconds
        if: env.CARGO_SCOPE != ''
        run: '"$TOOLS/ci" libtest-seconds "$MEASURED" test-run "$TESTLOG"'
      - name: lint
        run: '"$TOOLS/ci" logged "$BUDGET" "$TOOLS/ci" timed "$MEASURED" lint "$TOOLS/lint" .'
      - name: limits
        if: github.ref == 'refs/heads/main'
        run: '"$TOOLS/ci" logged "$LIMITS" cargo run -q --bin gate-limits -- ci/limits.toml "$MEASURED"'
      - name: step times
        if: github.ref == 'refs/heads/main' && always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: '"$TOOLS/ci" wall-times "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$GITHUB_JOB"'
      - name: report
        if: github.ref == 'refs/heads/main' && always()
        run: '"$TOOLS/ci" show "$BUDGET" ci/limits.toml "$MEASURED" "$LIMITS"'
      - name: fan-in
        if: github.ref == 'refs/heads/main' && always()
        run: '"$TOOLS/reach" fan-in "$METADATA"'

  mutants:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      TOOLS: ${{ github.workspace }}/target/ci/tools
      METADATA: ${{ github.workspace }}/target/ci/metadata.json
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: toolchain
        run: rustup toolchain install
      - uses: actions/cache@v4
        id: tools
        with:
          path: ${{ github.workspace }}/target/ci/tools
          key: tools-${{ runner.os }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'crates/lint*/Cargo.toml', 'crates/lint*/src/**', 'crates/newtype*/Cargo.toml', 'crates/newtype*/src/**', 'crates/reach/Cargo.toml', 'crates/reach/src/**', 'crates/ci/Cargo.toml', 'crates/ci/src/**', 'crates/mutation-report/Cargo.toml', 'crates/mutation-report/src/**', 'crates/text-lines/Cargo.toml', 'crates/text-lines/src/**') }}
      - name: tools
        if: steps.tools.outputs.cache-hit != 'true'
        run: cargo run -q --bin ci -- tools target/debug "$TOOLS"
      - name: reach
        run: '"$TOOLS/ci" reach "$METADATA" "$GITHUB_EVENT_NAME" "$GITHUB_ENV" "$GITHUB_STEP_SUMMARY"'
      - uses: taiki-e/install-action@v2
        if: env.MUTANTS_SCOPE != ''
        with:
          tool: cargo-mutants@27.1.0
      - name: mutants in changed lines
        run: '"$TOOLS/ci" mutants-changed "$RUNNER_TEMP/changed.diff" "$RUNNER_TEMP" $MUTANTS_SCOPE'
