name: ci

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read
  actions: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: toolchain
        run: rustup toolchain install
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        run: cargo test
      - name: lint
        shell: bash
        run: cargo run -p lint -- . | tee "$RUNNER_TEMP/budget.txt"
      - name: report
        if: github.ref == 'refs/heads/main' && always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "wall time per step, seconds:"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" \
            --jq '.jobs[] | select(.name == env.GITHUB_JOB) | .steps[] | select(.completed_at != null) | "\(.name): \((.completed_at | fromdate) - (.started_at | fromdate))"'
          cat "$RUNNER_TEMP/budget.txt"

  mutants:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: toolchain
        run: rustup toolchain install
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants@27.1.0
      - name: changed lines
        run: git diff --no-renames HEAD^1 HEAD -- '*.rs' > "$RUNNER_TEMP/changed.diff"
      - name: mutants in changed lines
        run: |
          status=0
          cargo mutants --in-diff "$RUNNER_TEMP/changed.diff" --output "$RUNNER_TEMP" --jobs 2 --colors never || status=$?
          if [ "$status" -ne 0 ] && [ "$status" -ne 3 ]; then exit "$status"; fi
          if [ -s "$RUNNER_TEMP/mutants.out/missed.txt" ]; then exit 2; fi
