name: ci

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: measured
        run: echo "MEASURED=$RUNNER_TEMP/measured.toml" >> "$GITHUB_ENV"
      - name: toolchain
        run: rustup toolchain install
      - name: tools path
        run: echo "TOOLS=$RUNNER_TEMP/tools" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        id: tools
        with:
          path: ${{ runner.temp }}/tools
          key: tools-${{ runner.os }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'crates/lint*/Cargo.toml', 'crates/lint*/src/**', 'crates/newtype*/Cargo.toml', 'crates/newtype*/src/**', 'crates/reach/Cargo.toml', 'crates/reach/src/**') }}
      - name: tools
        if: steps.tools.outputs.cache-hit != 'true'
        run: ci/tools.sh
      - name: reach
        run: ci/reach.sh | tee -a "$GITHUB_ENV" "$GITHUB_STEP_SUMMARY"
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        if: env.CARGO_SCOPE != ''
        run: ci/timed.sh clippy cargo clippy --locked --all-targets $CARGO_SCOPE -- -D warnings
      - name: test compile
        if: env.CARGO_SCOPE != ''
        run: ci/timed.sh test-compile cargo test --locked --no-run $CARGO_SCOPE
      - name: fuzz targets
        if: env.CARGO_SCOPE == '--workspace' || contains(env.CARGO_SCOPE, '-p fuzz')
        run: |
          cargo clippy --locked --all-targets -p fuzz --features campaign -- -D warnings
          cargo test --locked -p fuzz --features campaign --test fuzz --no-run
      - name: test run
        if: env.CARGO_SCOPE != ''
        run: |
          cargo test --locked $CARGO_SCOPE | tee "$RUNNER_TEMP/test.txt"
          ci/libtest-seconds.sh test-run "$RUNNER_TEMP/test.txt"
      - name: lint
        shell: bash
        run: ci/timed.sh lint "$TOOLS/lint" . | tee "$RUNNER_TEMP/budget.txt"
      - name: limits
        if: github.ref == 'refs/heads/main'
        run: cargo run --locked -q --bin gate-limits -- ci/limits.toml "$MEASURED" | tee "$RUNNER_TEMP/limits.txt"
      - name: report
        if: github.ref == 'refs/heads/main' && always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "wall time per step, seconds:"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" \
            --jq '.jobs[] | select(.name == env.GITHUB_JOB) | .steps[] | select(.completed_at != null) | "\(.name): \((.completed_at | fromdate) - (.started_at | fromdate))"'
          cat "$RUNNER_TEMP/budget.txt"
          echo "limits, seconds (warn above, block above):"
          cat ci/limits.toml
          echo "measured stages, seconds:"
          cat "$MEASURED"
          cat "$RUNNER_TEMP/limits.txt"
          cargo run --locked -q --bin reach -- fan-in "$RUNNER_TEMP/metadata.json"

  mutants:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: toolchain
        run: rustup toolchain install
      - name: tools path
        run: echo "TOOLS=$RUNNER_TEMP/tools" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        id: tools
        with:
          path: ${{ runner.temp }}/tools
          key: tools-${{ runner.os }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'crates/lint*/Cargo.toml', 'crates/lint*/src/**', 'crates/newtype*/Cargo.toml', 'crates/newtype*/src/**', 'crates/reach/Cargo.toml', 'crates/reach/src/**') }}
      - name: tools
        if: steps.tools.outputs.cache-hit != 'true'
        run: ci/tools.sh
      - name: reach
        run: ci/reach.sh | tee -a "$GITHUB_ENV"
      - uses: taiki-e/install-action@v2
        if: env.MUTANTS_SCOPE != ''
        with:
          tool: cargo-mutants@27.1.0
      - name: changed lines
        if: env.MUTANTS_SCOPE != ''
        run: git diff --no-renames HEAD^1 HEAD -- '*.rs' > "$RUNNER_TEMP/changed.diff"
      - name: mutants in changed lines
        if: env.MUTANTS_SCOPE != ''
        run: |
          status=0
          cargo mutants --in-diff "$RUNNER_TEMP/changed.diff" $MUTANTS_SCOPE --output "$RUNNER_TEMP" --jobs 2 --colors never || status=$?
          if [ "$status" -ne 0 ] && [ "$status" -ne 3 ]; then exit "$status"; fi
          if [ -s "$RUNNER_TEMP/mutants.out/missed.txt" ]; then exit 2; fi
