name: ci

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: measured
        run: echo "MEASURED=$RUNNER_TEMP/measured.toml" >> "$GITHUB_ENV"
      - name: toolchain
        run: ci/timed.sh toolchain rustup toolchain install
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: ci/timed.sh clippy cargo clippy --all-targets -- -D warnings
      - name: test compile
        run: ci/timed.sh test-compile cargo test --no-run
      - name: test run
        run: |
          cargo test | tee "$RUNNER_TEMP/test.txt"
          ci/libtest-seconds.sh test-run "$RUNNER_TEMP/test.txt"
      - name: lint
        run: ci/timed.sh lint cargo run -p lint -- . | tee "$RUNNER_TEMP/budget.txt"
      - name: limits
        run: cargo run -q -p gate-limits -- ci/limits.toml "$MEASURED" | tee "$RUNNER_TEMP/limits.txt"
      - name: report
        if: github.ref == 'refs/heads/main' && always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "wall time per step, seconds:"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" \
            --jq '.jobs[] | select(.name == env.GITHUB_JOB) | .steps[] | select(.completed_at != null) | "\(.name): \((.completed_at | fromdate) - (.started_at | fromdate))"'
          cat "$RUNNER_TEMP/budget.txt"
          echo "limits, seconds (warn above, block above):"
          cat ci/limits.toml
          echo "measured stages, seconds:"
          cat "$MEASURED"
          cat "$RUNNER_TEMP/limits.txt"
