name: ci

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read
  actions: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: toolchain
        run: rustup toolchain install
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        run: cargo test
      - name: lint
        run: cargo run -p lint -- . | tee "$RUNNER_TEMP/budget.txt"
      - name: report
        if: github.ref == 'refs/heads/main' && always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "wall time per step, seconds:"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" \
            --jq '.jobs[] | select(.name == env.GITHUB_JOB) | .steps[] | select(.completed_at != null) | "\(.name): \((.completed_at | fromdate) - (.started_at | fromdate))"'
          cat "$RUNNER_TEMP/budget.txt"
