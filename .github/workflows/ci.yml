name: ci

on:
  pull_request:
  push:
    branches: [main, "project/**"]

env:
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"
  RUSTFLAGS: -C link-arg=-fuse-ld=mold
  TIMED: target/debug/ci timed ci/limits.toml

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/toolchain
      - uses: mozilla-actions/sccache-action@v0.0.9
        with:
          version: v0.19.0
      - uses: rui314/setup-mold@v1
      - run: cargo fmt --check
      - run: cargo build --locked -q --bin ci
      - run: $TIMED clippy cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

  test:
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: ""
      TIMER: ${{ github.workspace }}/../timer/debug/ci
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/toolchain
      - uses: rui314/setup-mold@v1
      - name: the timer, built apart from the stage it times
        run: cargo build --locked -q --bin ci --target-dir ../timer
      - name: the target key, from what decides the third-party builds
        id: target
        run: |
          {
            grep -B2 '^source = ' Cargo.lock
            cat rust-toolchain.toml Cargo.toml
            env | grep -E '^(RUSTFLAGS|RUSTC_WRAPPER|CARGO_[A-Z_]+)=' | sort
          } | sha256sum | cut -c1-64 | sed 's/^/key=target-${{ runner.os }}-/' >> "$GITHUB_OUTPUT"
      - name: test-compile starts here, before target/ is restored
        run: date +%s.%N > ../test-compile.start
      - uses: actions/cache/restore@v4
        with:
          path: target
          key: ${{ steps.target.outputs.key }}
      - run: '"$TIMER" timed ci/limits.toml test-compile --since ../test-compile.start cargo test --locked --workspace --no-run --timings'
      - run: '"$TIMER" timed ci/limits.toml test-run cargo test --locked --workspace'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-compile-timings
          path: target/cargo-timings/cargo-timing.html
          if-no-files-found: ignore
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: target
          key: ${{ steps.target.outputs.key }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/toolchain
      - uses: mozilla-actions/sccache-action@v0.0.9
        with:
          version: v0.19.0
      - uses: rui314/setup-mold@v1
      - run: cargo build --locked -q --bin ci --bin lint
      - run: $TIMED lint target/debug/lint --timings .

  mutants-plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    env:
      GH_TOKEN: ${{ github.token }}
      RUSTC_WRAPPER: ""
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/toolchain
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants@27.1.0
      - name: the earlier run's results on this branch
        run: |
          mkdir -p "$RUNNER_TEMP/plan" "$RUNNER_TEMP/prior"
          run=$(gh run list --branch "$GITHUB_HEAD_REF" --workflow ci --event pull_request --status completed --limit 1 --json databaseId --jq '.[].databaseId')
          test -z "$run" || gh run download "$run" --pattern 'mutants-*' --dir "$RUNNER_TEMP/prior" || true
      - name: plan
        id: plan
        run: |
          shopt -s nullglob
          PLAN=$RUNNER_TEMP/plan PRIOR=$RUNNER_TEMP/prior
          git diff HEAD^1 HEAD > "$PLAN/changed.diff"
          git diff --numstat --no-renames HEAD^1 HEAD > "$PLAN/changed"
          git rev-parse HEAD^1 HEAD^2 > "$PLAN/heads"
          cargo mutants --list --json > "$PLAN/workspace.json"
          cargo mutants --list --json --in-diff "$PLAN/changed.diff" > "$PLAN/diff.json"
          heads="$PRIOR/mutants-plan/heads"
          earlier=()
          if test -f "$heads" && { git diff --numstat --no-renames "$(sed -n 1p "$heads")" HEAD^1 && git diff --numstat --no-renames "$(sed -n 2p "$heads")" HEAD^2; } > "$PLAN/numstat"; then
            earlier=("$PLAN/numstat" "$PRIOR"/*/*.json)
          fi
          cargo run --locked -q --bin ci -- mutants-plan "$PLAN/workspace.json" "$PLAN/diff.json" "$PLAN/changed" "$PLAN/reused.json" "$PLAN/caught.txt" "$GITHUB_OUTPUT" "${earlier[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: mutants-plan
          path: |
            ${{ runner.temp }}/plan/heads
            ${{ runner.temp }}/plan/reused.json
            ${{ runner.temp }}/plan/caught.txt

  mutants-shard:
    if: github.event_name == 'pull_request'
    name: mutants-shard (${{ matrix.shard }})
    needs: mutants-plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.mutants-plan.outputs.shards) }}
    env:
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/toolchain
      - uses: rui314/setup-mold@v1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants@27.1.0
      - uses: actions/download-artifact@v4
        with:
          name: mutants-plan
          path: ${{ runner.temp }}/plan
      - name: the planned mutants, skipping every one listed in caught.txt
        run: |
          PLAN=$RUNNER_TEMP/plan OUT=$RUNNER_TEMP/out
          mkdir -p "$OUT/mutants.out"
          cp "$PLAN/caught.txt" "$OUT/mutants.out/caught.txt"
          cargo mutants --no-shuffle --iterate --output "$OUT" --sharding round-robin --shard "${{ matrix.shard }}/${{ strategy.job-total }}"
      - uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: mutants-${{ matrix.shard }}
          path: ${{ runner.temp }}/out/mutants.out/outcomes.json
          if-no-files-found: ignore

  mutants:
    if: always() && github.event_name == 'pull_request'
    needs: mutants-shard
    runs-on: ubuntu-latest
    steps:
      - name: every shard succeeded
        env:
          SHARDS: ${{ needs.mutants-shard.result }}
        run: test "$SHARDS" = success
