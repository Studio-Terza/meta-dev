name: ci

on:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"
  RUSTFLAGS: -C link-arg=-fuse-ld=mold
  TIMED: target/debug/ci timed ci/limits.toml

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  clippy:
    runs-on: ubuntu-latest
    env:
      TIMER: ${{ github.workspace }}/../timer/debug/ci
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/toolchain
      - uses: mozilla-actions/sccache-action@v0.0.9
        with:
          version: v0.19.0
      - uses: rui314/setup-mold@v1
      - run: cargo fmt --check
      - name: the timer, built apart from the stage it times
        run: cargo build --locked -q --bin ci --target-dir ../timer
      - name: the target key, the toolchain, profiles and environment, then the registry lockfile
        id: target
        run: |
          build=$({ cat rust-toolchain.toml; awk '/^\[/ { profile = /^\[profile/ } profile' Cargo.toml; env | grep -E '^(RUSTFLAGS|RUSTC_WRAPPER|CARGO_[A-Z_]+)=' | sort; } | sha256sum | cut -c1-64)
          registry=$(grep -B2 '^source = ' Cargo.lock | sha256sum | cut -c1-64)
          echo "prefix=clippy-${{ runner.os }}-$build-" >> "$GITHUB_OUTPUT"
          echo "key=clippy-${{ runner.os }}-$build-$registry" >> "$GITHUB_OUTPUT"
      - name: clippy starts here, before target/ is restored
        run: date +%s.%N > ../clippy.start
      - uses: actions/cache/restore@v4
        with:
          path: target
          key: ${{ steps.target.outputs.key }}
          restore-keys: ${{ steps.target.outputs.prefix }}
      - run: '"$TIMER" timed ci/limits.toml clippy --since ../clippy.start cargo clippy --locked --workspace --all-targets --all-features -- -D warnings'
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: target
          key: ${{ steps.target.outputs.key }}

  test:
    runs-on: ubuntu-latest
    env:
      TIMER: ${{ github.workspace }}/../timer/debug/ci
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/toolchain
      - uses: mozilla-actions/sccache-action@v0.0.9
        with:
          version: v0.19.0
      - uses: rui314/setup-mold@v1
      - name: the timer, built apart from the stage it times
        run: cargo build --locked -q --bin ci --target-dir ../timer
      - name: the target key, the toolchain, profiles and environment, then the registry lockfile
        id: target
        run: |
          build=$({ cat rust-toolchain.toml; awk '/^\[/ { profile = /^\[profile/ } profile' Cargo.toml; env | grep -E '^(RUSTFLAGS|RUSTC_WRAPPER|CARGO_[A-Z_]+)=' | sort; } | sha256sum | cut -c1-64)
          registry=$(grep -B2 '^source = ' Cargo.lock | sha256sum | cut -c1-64)
          echo "prefix=target-${{ runner.os }}-$build-" >> "$GITHUB_OUTPUT"
          echo "key=target-${{ runner.os }}-$build-$registry" >> "$GITHUB_OUTPUT"
      - name: test-compile starts here, before target/ is restored
        run: date +%s.%N > ../test-compile.start
      - uses: actions/cache/restore@v4
        with:
          path: target
          key: ${{ steps.target.outputs.key }}
          restore-keys: ${{ steps.target.outputs.prefix }}
      - run: '"$TIMER" timed ci/limits.toml test-compile --since ../test-compile.start cargo test --locked --workspace --no-run --timings'
      - run: '"$TIMER" timed ci/limits.toml test-run cargo test --locked --workspace'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-compile-timings
          path: target/cargo-timings/cargo-timing.html
          if-no-files-found: ignore
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: target
          key: ${{ steps.target.outputs.key }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/toolchain
      - uses: mozilla-actions/sccache-action@v0.0.9
        with:
          version: v0.19.0
      - uses: rui314/setup-mold@v1
      - run: cargo build --locked -q --bin ci --bin lint
      - run: $TIMED lint target/debug/lint --timings .

  mutants-plan:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: ./.github/actions/toolchain
      - uses: mozilla-actions/sccache-action@v0.0.9
        with:
          version: v0.19.0
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants@27.1.0
      - name: plan
        id: plan
        run: |
          PLAN=$RUNNER_TEMP/plan
          mkdir -p "$PLAN"
          git diff HEAD^1 HEAD > "$PLAN/changed.diff"
          git diff --numstat --no-renames HEAD^1 HEAD > "$PLAN/changed"
          cargo mutants --list --json > "$PLAN/workspace.json"
          cargo mutants --list --json --in-diff "$PLAN/changed.diff" > "$PLAN/diff.json"
          cargo run --locked -q --bin ci -- mutants-plan "$PLAN/workspace.json" "$PLAN/diff.json" "$PLAN/changed" "$PLAN/unselected.txt" "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: mutants-plan
          path: ${{ runner.temp }}/plan/unselected.txt

  mutants-shard:
    name: mutants-shard (${{ matrix.shard }})
    needs: mutants-plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.mutants-plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/toolchain
      - uses: mozilla-actions/sccache-action@v0.0.9
        with:
          version: v0.19.0
      - uses: rui314/setup-mold@v1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants@27.1.0
      - uses: actions/download-artifact@v4
        with:
          name: mutants-plan
          path: ${{ runner.temp }}/plan
      - name: every selected mutant, the unselected passed to --iterate as caught
        run: |
          PLAN=$RUNNER_TEMP/plan OUT=$RUNNER_TEMP/out
          mkdir -p "$OUT/mutants.out"
          cp "$PLAN/unselected.txt" "$OUT/mutants.out/caught.txt"
          cargo mutants --no-shuffle --iterate --output "$OUT" --sharding round-robin --shard "${{ matrix.shard }}/${{ strategy.job-total }}"
      - uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: mutants-${{ matrix.shard }}
          path: ${{ runner.temp }}/out/mutants.out/outcomes.json
          if-no-files-found: ignore

  mutants:
    if: always()
    needs: mutants-shard
    runs-on: ubuntu-latest
    steps:
      - name: every shard succeeded
        env:
          SHARDS: ${{ needs.mutants-shard.result }}
        run: test "$SHARDS" = success
