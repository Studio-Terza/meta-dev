name: fuzz

on:
  schedule:
    - cron: "43 4 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  PROPTEST_CASES: "100000"

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/toolchain
      - name: fuzz the runner for PROPTEST_CASES generated inputs
        run: cargo test --locked -p fuzz --features campaign --test fuzz
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: crashes
          path: fuzz/tests/fuzz/main.proptest-regressions
          if-no-files-found: ignore
          retention-days: 90
