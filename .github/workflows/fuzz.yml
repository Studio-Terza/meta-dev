name: fuzz

on:
  schedule:
    - cron: "43 4 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  FUZZ_SECONDS: "720"

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/toolchain
      - name: fuzz the runner for FUZZ_SECONDS; a failure prints its shrunk input
        run: cargo test --locked -p fuzz --features campaign --test fuzz
