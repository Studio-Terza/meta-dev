name: labels

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  scenarios:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PULL_REQUEST: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: ./.github/actions/toolchain
      - name: golden and scenario files lie in the reach of the change
        env:
          METADATA: ${{ runner.temp }}/metadata.json
        run: cargo run --locked -q --bin ci -- labels "$PULL_REQUEST" "$METADATA"

  spec-line:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PULL_REQUEST: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: ./.github/actions/toolchain
      - name: the body carries a well-formed spec line, or repair main
        run: cargo run --locked -q --bin ci -- spec-line "$PULL_REQUEST"
