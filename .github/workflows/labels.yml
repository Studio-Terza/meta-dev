name: labels

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  scenarios:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: toolchain
        run: rustup toolchain install
      - name: golden and scenario files carry their labels
        run: cargo run --locked -q --bin ci -- labels "$GITHUB_BASE_REF" ${{ github.event.pull_request.number }}
