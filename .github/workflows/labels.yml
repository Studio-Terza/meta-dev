name: labels

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  scenarios:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PULL_REQUEST: ${{ github.event.pull_request.number }}
      METADATA: ${{ runner.temp }}/metadata.json
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: ./.github/actions/toolchain
      - name: golden and scenario files lie in the reach of the change
        run: cargo run --locked -q --bin ci -- labels "$GITHUB_BASE_REF" "$PULL_REQUEST" "$METADATA"
