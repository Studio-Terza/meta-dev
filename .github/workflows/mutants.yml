name: mutants

# Mutants run once per head, on the head an agent reports DONE on: the subagent-stop hook adds the
# `mutants` label, and a push leaves the new head without a `mutants` check until the next DONE, so
# the required check blocks a merge of any head it did not run on. Any other label names the gate
# job `unrequested`, so it can neither satisfy nor fail the required `mutants` check.

on:
  pull_request:
    types: [labeled]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -C link-arg=-fuse-ld=mold

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  mutants-plan:
    if: github.event.label.name == 'mutants'
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: ./.github/actions/toolchain
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants@27.1.0
      - name: plan
        id: plan
        run: |
          PLAN=$RUNNER_TEMP/plan
          mkdir -p "$PLAN"
          git diff HEAD^1 HEAD > "$PLAN/changed.diff"
          git diff --numstat --no-renames HEAD^1 HEAD > "$PLAN/changed"
          cargo mutants --list --json > "$PLAN/workspace.json"
          cargo mutants --list --json --in-diff "$PLAN/changed.diff" > "$PLAN/diff.json"
          cargo run --locked -q --bin ci -- mutants-plan "$PLAN/workspace.json" "$PLAN/diff.json" "$PLAN/changed" "$PLAN/unselected.txt" "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: mutants-plan
          path: ${{ runner.temp }}/plan/unselected.txt

  mutants-shard:
    name: mutants-shard (${{ matrix.shard }})
    needs: mutants-plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.mutants-plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/toolchain
      - uses: rui314/setup-mold@v1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants@27.1.0
      - uses: actions/download-artifact@v4
        with:
          name: mutants-plan
          path: ${{ runner.temp }}/plan
      - name: every selected mutant, the unselected passed to --iterate as caught
        run: |
          PLAN=$RUNNER_TEMP/plan OUT=$RUNNER_TEMP/out
          mkdir -p "$OUT/mutants.out"
          cp "$PLAN/unselected.txt" "$OUT/mutants.out/caught.txt"
          cargo mutants --no-shuffle --iterate --output "$OUT" --sharding round-robin --shard "${{ matrix.shard }}/${{ strategy.job-total }}"
      - uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: mutants-${{ matrix.shard }}
          path: ${{ runner.temp }}/out/mutants.out/outcomes.json
          if-no-files-found: ignore

  mutants:
    name: ${{ github.event.label.name == 'mutants' && 'mutants' || 'unrequested' }}
    if: always()
    needs: mutants-shard
    runs-on: ubuntu-latest
    steps:
      - name: every shard succeeded
        env:
          LABEL: ${{ github.event.label.name }}
          SHARDS: ${{ needs.mutants-shard.result }}
        run: test "$LABEL" != mutants || test "$SHARDS" = success
