name: mutants

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
  push:
    branches: [work/mutation-d3]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  shard:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        index: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - name: toolchain
        run: rustup toolchain install
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants@27.1.0
      - name: mutants in shard
        env:
          SHARD: ${{ matrix.index }}/8
        run: |
          status=0
          cargo mutants --shard "$SHARD" --sharding round-robin --output "$RUNNER_TEMP" --jobs 2 --colors never -- --no-fail-fast || status=$?
          if [ "$status" -ne 0 ] && [ "$status" -ne 2 ] && [ "$status" -ne 3 ]; then exit "$status"; fi
      - name: which tests failed per mutant
        if: always()
        run: python3 -I .github/scripts/mutation_matrix.py shard "$RUNNER_TEMP/mutants.out" "$RUNNER_TEMP/mutants.out/matrix.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shard-${{ matrix.index }}
          path: |
            ${{ runner.temp }}/mutants.out/*.txt
            ${{ runner.temp }}/mutants.out/outcomes.json
            ${{ runner.temp }}/mutants.out/matrix.json
          retention-days: 30

  report:
    needs: shard
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: shard-*
          path: shards
      - name: summary
        run: |
          for outcome in caught missed timeout unviable; do
            echo "$outcome: $(cat shards/*/"$outcome".txt | wc -l)"
          done | tee -a "$GITHUB_STEP_SUMMARY"
          {
            echo '```'
            cat shards/*/missed.txt shards/*/timeout.txt | sort
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: matrix
        run: |
          mkdir matrix
          python3 -I .github/scripts/mutation_matrix.py report shards . matrix/report.md matrix/report.json
          cat matrix/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: mutation-matrix
          path: matrix
          retention-days: 90
